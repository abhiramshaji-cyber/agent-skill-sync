[metadata]
name = agent-skill-sync
version = 0.1.0
description = Safely synchronize skills and commands between Claude Code and Codex
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    skill-sync = agent_skill_sync.cli:main

